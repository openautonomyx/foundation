id: twin.contract-review-assistant
type: digital-twin
name: Contract Review Assistant Digital Twin
description: Two-way digital twin of the contract-review assistant pairing its approved definition (desired state) with a runtime snapshot (observed state).
version: 1.0.0
status: active
owner: platform-operations
