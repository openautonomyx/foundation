  - approver-identity
  - policy-context
  - decision-record
  - action-event
  - audit-trail
testMethod: automated-check
controlStatus: designed
exceptions: []
findings: []
remediationPlan: ""

governance:
  policies:
    - policies/human-approval.md
    - policies/exception-management.md
  controls: []
  approvers:
    - governance-board
