name: Build & Publish Registry Catalog

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "registry/**"
      - "schemas/**"
      - "scripts/build_catalog.py"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet pyyaml jsonschema
      - name: Validate registry and rebuild catalog
        run: python scripts/build_catalog.py
      - name: Commit regenerated catalog (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- registry/INDEX.md docs/catalog.json docs/index.html; then
            git add registry/INDEX.md docs/catalog.json docs/index.html
            git commit -m "chore: rebuild registry catalog [skip ci]"
            git push
          else
            echo "Catalog already up to date."
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
